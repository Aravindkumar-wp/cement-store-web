<!DOCTYPE html>
<html>

<head>
    <title>Edit Supplier Payment</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <div class="flex justify-center items-center h-screen">

        <div class="bg-white p-6 rounded shadow w-96">

            <h2 class="text-xl font-bold mb-4">✏️ Edit Supplier Payment</h2>

            <form method="POST">

                <label class="block mb-2">Amount</label>

                <input type="number" name="amount" value="{{ p[1] }}" class="border p-2 rounded w-full mb-4" required>

                <div class="flex justify-between">
                    <a href="/suppliers" class="bg-gray-500 text-white px-4 py-2 rounded">
                        Cancel
                    </a>

                    <button class="bg-blue-600 text-white px-4 py-2 rounded">
                        Update
                    </button>
                </div>

            </form>

        </div>

    </div>

</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <title>Download Reports</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <div class="flex">

        <!-- SIDEBAR -->
        <div class="w-64 bg-blue-900 text-white h-screen fixed left-0 top-0 p-5">

            <h2 class="text-xl font-bold mb-6">Cement Store</h2>

            <ul class="space-y-3 text-sm">

                <li><a href="/" class="block hover:text-gray-300">🏠 Dashboard</a></li>
                <li><a href="/customers" class="block hover:text-gray-300">👥 Customers</a></li>
                <li><a href="/search" class="block hover:text-gray-300">🔍 Search</a></li>
                <li><a href="/add_customer" class="block hover:text-gray-300">➕ Add Customer</a></li>
                <li><a href="/add_sale" class="block hover:text-gray-300">💰 Add Sale</a></li>
                <li><a href="/payments" class="block hover:text-gray-300">💳 Payments</a></li>
                <li><a href="/upload_customers" class="block hover:text-gray-300">📂 Upload Excel</a></li>

                <!-- NEW -->
                <li>
                    <a href="/download_report" class="block font-bold text-yellow-300">
                        ⬇️ Download Reports
                    </a>
                </li>
                <li>
                    <a href="/attendance"
                        class="block {{ 'font-bold text-yellow-300' if '/attendance' in request.path else 'hover:text-gray-300' }}">
                        🧑‍🏭 Attendance
                    </a>
                </li>
                <li>
                    <a href="/worker_payments"
                        class="block {{ 'font-bold text-yellow-300' if '/worker_payments' in request.path else 'hover:text-gray-300' }}">
                        💸 Worker Advances
                    </a>
                </li>
                <li><a href="/suppliers" class="block hover:text-gray-300">🏭 Suppliers</a></li>
                <li><a href="/stock" class="block hover:text-gray-300">📦 Stock</a></li>
                <li><a href="/expense_report" class="block hover:text-gray-300">📊 Labour & Transport Report</a></li>
                <li><a href="/logout" class="block hover:text-red-300">📤 Logout</a></li>

            </ul>

        </div>

        <!-- MAIN -->
        <div class="flex-1 ml-64 p-8">

            <h1 class="text-2xl font-bold mb-6">⬇️ Download Reports</h1>

            <div class="bg-white p-6 rounded-xl shadow max-w-xl">

                <form method="POST" class="space-y-4">

                    <!-- TYPE -->
                    <div>
                        <label class="block mb-1">Report Type</label>
                        <select name="type" class="w-full p-2 border rounded" required>

                            <option value="" disabled selected>
                                🔽 Select Report Type
                            </option>

                            <option value="sales">📦 Sales Report</option>
                            <option value="payments">💰 Collection Report</option>


                        </select>
                    </div>

                    <!-- FROM -->
                    <div>
                        <label class="block mb-1">From Date</label>
                        <input type="date" name="from_date" class="w-full p-2 border rounded" required>
                    </div>

                    <!-- TO -->
                    <div>
                        <label class="block mb-1">To Date</label>
                        <input type="date" name="to_date" class="w-full p-2 border rounded" required>
                    </div>

                    <button class="bg-blue-600 text-white px-4 py-2 rounded w-full">
                        Download Excel
                    </button>



                    <script>
                        function validateForm() {
                            const type = document.querySelector("[name='type']").value;

                            if (!type) {
                                alert("⚠️ Please select report type");
                                return false;
                            }

                            return true;
                        }
                    </script>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
